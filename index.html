        const { useState, useEffect, useRef } = React;

        const useIntersectionObserver = () => {
            useEffect(() => {
                if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
                    return;
                }
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('active');
                            // Optional: Stop observing once active
                            // observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

                document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
                return () => observer.disconnect();
            }, []);
        };

        const useScrollPosition = () => {
            const [scrollPos, setScrollPos] = useState(0);
            useEffect(() => {
                const updatePosition = () => setScrollPos(window.scrollY);
                window.addEventListener('scroll', updatePosition);
                updatePosition();
                return () => window.removeEventListener('scroll', updatePosition);
            }, []);
            return scrollPos;
        };

                ghost: "text-brand-dark hover:text-brand-yellow bg-white/50 hover:bg-white"

        const ContactForm = ({ selectedServiceId }) => {
            const [status, setStatus] = useState('idle');
            const [formData, setFormData] = useState({
                name: '', email: '', phone: '', company: '', service: selectedServiceId || '', budget: '', message: ''
            });

            // Update local form state when selectedServiceId changes from parent
            useEffect(() => {
                if (selectedServiceId) {
                    setFormData(prev => ({ ...prev, service: selectedServiceId }));
                }
            }, [selectedServiceId]);

            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

            const handleSubmit = (e) => {
                e.preventDefault();
                setStatus('loading');
                
                // Construct WhatsApp Message
                const text = `Hello Prime Creative Technologies,\n\nI would like to enquire about your services.\n\nName: ${formData.name}\nEmail: ${formData.email}\nPhone: ${formData.phone}\nService: ${formData.service}\nMessage: ${formData.message}`;
                const url = `https://wa.me/917259184159?text=${encodeURIComponent(text)}`;

                // Process and redirect to WhatsApp
                setTimeout(() => {
                    setStatus('success');
                    window.open(url, '_blank');
                    setFormData({name: '', email: '', phone: '', company: '', service: selectedServiceId || '', budget: '', message: ''});
                    setTimeout(() => setStatus('idle'), 5000);
                }, 800);

                                            <div className="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-1">WhatsApp Us</div>

                                        </div>
                                    </a>
                                    <a href={SITE_CONFIG.phoneLink} className="flex items-center group">
                                        <div className="w-12 h-12 bg-zinc-50 text-brand-dark rounded-full flex items-center justify-center text-xl mr-4 group-hover:bg-brand-dark group-hover:text-white transition-colors"><i className="ph ph-phone"></i></div>

                                            <div className="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-1">Call Us</div>
                                            <div className="font-semibold text-brand-dark">{SITE_CONFIG.phone}</div>
                                        </div>
                                    </a>
                                    <a href={`mailto:${SITE_CONFIG.email}`} className="flex items-center group">
                                        <div className="w-12 h-12 bg-blue-50 text-brand-blue rounded-full flex items-center justify-center text-xl mr-4 group-hover:bg-brand-blue group-hover:text-white transition-colors"><i className="ph ph-envelope-simple"></i></div>
                                        <div>
                                            <div className="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-1">Email Us</div>
                                            <div className="font-semibold text-brand-dark break-all">{SITE_CONFIG.email}</div>
                                        </div>
                                    </a>
                                </div>
                            </div>

                            {/* Form */}

                                        <div>
                                            <label className={labelClass}>Full Name *</label>
                                            <input type="text" name="name" required value={formData.name} onChange={handleChange} className={inputClass} placeholder="John Doe" />
                                        </div>
                                        <div>
                                            <label className={labelClass}>Email Address *</label>
                                            <input type="email" name="email" required value={formData.email} onChange={handleChange} className={inputClass} placeholder="john@example.com" />
                                        </div>

                                        <div>

                            </div>

                            <h4 className="font-bold uppercase tracking-wider text-xs mb-6 text-brand-yellow">Core Services</h4>
                            <ul className="space-y-4 text-sm text-zinc-400">
                                <li><a href="#services" className="hover:text-white transition-colors">Digital Marketing</a></li>
                                <li><a href="#services" className="hover:text-white transition-colors">Video & Creative Studio</a></li>
                                <li><a href="#services" className="hover:text-white transition-colors">SEO & Analytics</a></li>
                                <li><a href="#services" className="hover:text-white transition-colors">Business Setup</a></li>
                            </ul>
                        </div>

                        <div className="col-span-2 lg:col-span-2">
                            <h4 className="font-bold uppercase tracking-wider text-xs mb-6 text-brand-yellow">Company</h4>
                            <ul className="space-y-4 text-sm text-zinc-400">
                                <li><a href="#solutions" className="hover:text-white transition-colors">Solutions</a></li>
                                <li><a href="#portfolio" className="hover:text-white transition-colors">Portfolio</a></li>
                                <li><a href="#education" className="hover:text-white transition-colors">Courses</a></li>
                                <li><a href="#contact" className="hover:text-white transition-colors">Contact</a></li>
                            </ul>
                        </div>

                        <div className="col-span-2 lg:col-span-3">
                            <h4 className="font-bold uppercase tracking-wider text-xs mb-6 text-brand-yellow">Contact Us</h4>
                            <ul className="space-y-4 text-sm text-zinc-400">
                                <li className="flex items-start">
                                    <i className="ph ph-envelope-simple mt-1 mr-3 text-lg text-zinc-500"></i>
                                    <a href={`mailto:${SITE_CONFIG.email}`} className="break-all hover:text-white transition-colors">{SITE_CONFIG.email}</a>
                                </li>
                                <li className="flex items-start">
                                    <i className="ph ph-phone mt-1 mr-3 text-lg text-zinc-500"></i>
                                    <a href={SITE_CONFIG.phoneLink} className="hover:text-white transition-colors">+91 {SITE_CONFIG.phone}</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    
                    <div className="pt-8 border-t border-zinc-800 flex flex-col md:flex-row justify-between items-center text-xs text-zinc-500 font-medium">
                        <p>&copy; {new Date().getFullYear()} Prime Creative Technologies. All rights reserved.</p>
                        <div className="flex gap-6 mt-4 md:mt-0">
                            <a href="#" className="hover:text-white transition-colors">Privacy Policy</a>
                            <a href="#" className="hover:text-white transition-colors">Terms & Conditions</a>
                            <a href="#" className="hover:text-white transition-colors">Cookie Policy</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            useIntersectionObserver();
            
            // Global State for Form selection
            const [selectedFormService, setSelectedFormService] = useState('');
            
            // Modal State
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [activeService, setActiveService] = useState(null);

            const handleOpenModal = (service) => {
                setActiveService(service);
                setIsModalOpen(true);
            };

            const handleSelectServiceForContact = (serviceTitle) => {
                setSelectedFormService(serviceTitle);
                setTimeout(() => {
                    document.getElementById('contact').scrollIntoView({ behavior: 'smooth' });
                }, 300); // Wait for modal close
            };

            const handleGenericContactClick = () => {
                setSelectedFormService('');
                document.getElementById('contact').scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <div className="min-h-screen flex flex-col bg-brand-gray">
                    <Navbar />
                    
                    <main className="flex-grow">
                        <Hero onContactClick={handleGenericContactClick} />
                        
                        <AdSenseUnit />

                        <ServicesGrid onOpenModal={handleOpenModal} />
                        
                        <AdSenseUnit />

                        {/* Detailed Feature Sections Mapping to Images */}
                        <div id="solutions">
                            <VisualSection 
                                id="marketing"
                                badge="Growth"
                                title="Digital Marketing That Drives Attention Into Action"
                                imageSrc={IMAGES.digitalMarketing}
                                imageAlt="Digital marketing strategy and analytics"
                                list={['Data-driven campaign strategy', 'Social media & Content strategy', 'Lead generation & Paid Ads', 'Performance analysis']}
                                cta="Discuss Strategy"
                                reverse={false}
                                onCtaClick={() => handleSelectServiceForContact('Digital Marketing')}
                            />

                            <VisualSection 
                                id="video"
                                badge="Production"
                                title="Turn Ideas Into Visual Stories"
                                imageSrc={IMAGES.videoEditing}
                                imageAlt="Professional video editing studio"
                                list={['High-retention short-form reels', 'YouTube & Promotional videos', 'Corporate & Educational content', 'Professional post-production']}
                                cta="Discuss Your Video Project"
                                reverse={true}
                                dark={true}
                                onCtaClick={() => handleSelectServiceForContact('Video Editing')}
                            />
                            
                            <VisualSection 
                                id="creative"
                                badge="Creative"
                                title="Full-Scale Creative Studio Production"
                                imageSrc={IMAGES.creativeStudio}
                                imageAlt="Creative production workspace"
                                list={['Video Production & Direction', 'Product Content Creation', 'Social Media Visuals', 'Brand Aesthetics']}
                                cta="Start Creative Project"
                                reverse={false}
                                onCtaClick={() => handleSelectServiceForContact('Video Editing')}
                            />

                            <VisualSection 
                                id="social"
                                badge="Social"
                                title="Your Social Media. Strategically Managed."
                                imageSrc={IMAGES.socialMedia}
                                imageAlt="Social media content management"
                                list={['Content Planning & Calendar', 'Post Design & Caption Writing', 'Reels Strategy & Publishing', 'Community Management & Analytics']}
                                cta="Manage My Social Media"
                                reverse={true}
                                onCtaClick={() => handleSelectServiceForContact('Social Media Management')}
                            />

                            <AdSenseUnit />

                            <VisualSection 
                                id="seo"
                                badge="Search"
                                title="Get Found. Get Trusted."
                                imageSrc={IMAGES.seo}
                                imageAlt="SEO analytics dashboard"
                                list={['Technical & On-page SEO', 'Keyword Research & Content Strategy', 'Local SEO & Search Visibility', 'In-depth Analytics & Reporting']}
                                cta="Improve My SEO"
                                reverse={false}
                                dark={true}
                                onCtaClick={() => handleSelectServiceForContact('SEO & Analytics')}
                            />

                            <VisualSection 
                                id="gbp"
                                badge="Local"
                                title="Make Your Business Easier to Find"
                                imageSrc={IMAGES.gbp}
                                imageAlt="Google Business Profile management"
                                list={['Profile setup & optimization', 'Accurate business & location info', 'Review management strategy', 'Performance insights tracking']}
                                cta="Improve My Local Presence"
                                reverse={true}
                                onCtaClick={() => handleSelectServiceForContact('Google Business Profile')}
                            />
                            
                            <VisualSection 
                                id="analysis"
                                badge="Strategy"
                                title="Understand the Market Before You Invest"
                                imageSrc={IMAGES.marketAnalysis}
                                imageAlt="Business market analysis meeting"
                                list={['Market & Competitor Analysis', 'Customer & Industry Profiling', 'Digital Presence Auditing', 'Opportunity & Growth Planning']}
                                cta="Analyze My Business"
                                reverse={false}
                                onCtaClick={() => handleSelectServiceForContact('Business & Market Analysis')}
                            />

                            <ProcessSection />

                            <VisualSection 
                                id="setup"
                                badge="Operations"
                                title="From Idea to Operating Business"
                                imageSrc={IMAGES.businessSetup}
                                imageAlt="Business setup consultation"
                                list={['Business & Website planning', 'Digital presence & Social setup', 'Workflow & Technology planning', 'Marketing foundation deployment']}
                                cta="Plan My Business"
                                reverse={true}
                                onCtaClick={() => handleSelectServiceForContact('Business Setup')}
                            />

                            <AdSenseUnit />

                            <VisualSection 
                                id="sap"
                                badge="Technology"
                                title="Business Software & Technology Solutions"
                                imageSrc={IMAGES.sap}
                                imageAlt="SAP technology training"
                                list={['Authorized SAP access / support', 'Essential business software setup', 'Digital workflows & automations', 'Technology & Systems guidance']}
                                cta="Upgrade Technology"
                                reverse={false}
                                dark={true}
                                onCtaClick={() => handleSelectServiceForContact('SAP & Software Solutions')}
                            />
                        </div>

                        <EducationSection onContactClick={() => handleSelectServiceForContact('Online Learning')} />
                        <PortfolioSection />
                        
                        <AdSenseUnit />

                        <ContactForm selectedServiceId={selectedFormService} />
                    </main>

                    <Footer />
                    
                    <FloatingContact />

                    <ServiceModal 
                        isOpen={isModalOpen} 
                        service={activeService} 
                        onClose={() => setIsModalOpen(false)} 
                        onSelectService={handleSelectServiceForContact}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
